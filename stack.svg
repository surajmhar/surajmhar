<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 490" width="100%" height="auto">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <pattern id="stack-grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#333333" fill-opacity="0.18"/>
    </pattern>

    <style>
      .stack-tag {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 10px;
        font-weight: 600;
        fill: #E31B23;
        letter-spacing: 2px;
      }
      .stack-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 24px;
        font-weight: 800;
        fill: #F5F5F5;
        letter-spacing: -0.3px;
      }
      .stack-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        fill: #A3A3A3;
      }
      .stack-cat-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        fill: #F5F5F5;
        letter-spacing: 0.5px;
      }
      .stack-cat-sub {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 9.5px;
        fill: #888888;
        letter-spacing: 0.8px;
      }
      .stack-badge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        fill: #E5E5E5;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="490" rx="16" fill="url(#stack-bg)"/>
  <rect width="850" height="490" rx="16" fill="url(#stack-grid-dots)"/>
  <rect width="850" height="490" rx="16" fill="none" stroke="#1F1F1F" stroke-width="1.2"/>

  <!-- Orbital Visual Tracks (Subtle Background Aesthetics) -->
  <ellipse cx="425" cy="270" rx="390" ry="170" fill="none" stroke="#E31B23" stroke-width="0.8" stroke-dasharray="4 16" opacity="0.2"/>
  <ellipse cx="425" cy="270" rx="340" ry="145" fill="none" stroke="#D1D5DB" stroke-width="0.8" stroke-dasharray="2 18" opacity="0.15"/>
  <ellipse cx="425" cy="270" rx="290" ry="120" fill="none" stroke="#333333" stroke-width="0.8" stroke-dasharray="6 12" opacity="0.3"/>

  <!-- Header Section -->
  <g transform="translate(45, 34)">
    <text x="0" y="0" class="stack-tag">// 02 · ORBITAL SYSTEM &amp; TECHNOLOGIES</text>
    <text x="0" y="26" class="stack-title">Technologies &amp; Creative Stack</text>
    <text x="0" y="46" class="stack-subtitle">Three structured capability layers across engineering, marketing, and creative production.</text>
  </g>

  <!-- LAYER 1: DEVELOPMENT & SOFTWARE ENGINEERING -->
  <g transform="translate(45, 95)">
    <rect width="760" height="110" rx="12" fill="#0B0B0B" stroke="#222222" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="110" rx="2" fill="#E31B23"/>

    <!-- Category Header -->
    <g transform="translate(20, 16)">
      <text x="0" y="10" class="stack-cat-title">DEVELOPMENT</text>
      <text x="120" y="10" class="stack-cat-sub">// WEB, BACKEND, DATABASE &amp; VERSION CONTROL</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(20, 42)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="82" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- Python Icon -->
        <path d="M 12 11 C 12 9.5 13 8.5 15 8.5 L 18 8.5 L 18 11 L 14 11 L 14 13 L 20 13 L 20 16 L 17 16 C 14 16 12 14.5 12 12.5 Z" fill="#3776AB"/>
        <path d="M 22 19 C 22 20.5 21 21.5 19 21.5 L 16 21.5 L 16 19 L 20 19 L 20 17 L 14 17 L 14 14 L 17 14 C 20 14 22 15.5 22 17.5 Z" fill="#FFD43B"/>
        <text x="28" y="19" class="stack-badge-label">Python</text>
      </g>

      <!-- Flask -->
      <g transform="translate(90, 0)">
        <rect width="72" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- Flask icon -->
        <path d="M 15 9 L 19 9 L 19 13 L 22 19 C 22.5 20 21.5 21 20 21 L 14 21 C 12.5 21 11.5 20 12 19 L 15 13 Z" fill="none" stroke="#F5F5F5" stroke-width="1.2"/>
        <text x="28" y="19" class="stack-badge-label">Flask</text>
      </g>

      <!-- JavaScript -->
      <g transform="translate(170, 0)">
        <rect width="102" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- JS Icon -->
        <rect x="11" y="8" width="14" height="14" rx="2" fill="#F7DF1E"/>
        <text x="14" y="19" font-family="sans-serif" font-size="8" font-weight="900" fill="#000000">JS</text>
        <text x="32" y="19" class="stack-badge-label">JavaScript</text>
      </g>

      <!-- Next.js -->
      <g transform="translate(280, 0)">
        <rect width="84" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- Next.js Icon -->
        <circle cx="18" cy="15" r="7" fill="#000000" stroke="#F5F5F5" stroke-width="1"/>
        <path d="M 15 11 L 15 19 M 15 11 L 21 19 M 21 11 L 21 16" fill="none" stroke="#F5F5F5" stroke-width="1"/>
        <text x="30" y="19" class="stack-badge-label">Next.js</text>
      </g>

      <!-- Supabase -->
      <g transform="translate(372, 0)">
        <rect width="94" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- Supabase Icon -->
        <path d="M 18 8 L 12 16 L 17 16 L 14 22 L 21 14 L 16 14 Z" fill="#3ECF8E"/>
        <text x="26" y="19" class="stack-badge-label">Supabase</text>
      </g>

      <!-- HTML5 & CSS3 -->
      <g transform="translate(474, 0)">
        <rect width="124" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <path d="M 12 9 L 19 9 L 18 19 L 15.5 20.5 L 13 19 Z" fill="#E34F26"/>
        <path d="M 23 9 L 30 9 L 29 19 L 26.5 20.5 L 24 19 Z" fill="#1572B6"/>
        <text x="36" y="19" class="stack-badge-label">HTML5 &amp; CSS3</text>
      </g>

      <!-- Git & GitHub -->
      <g transform="translate(606, 0)">
        <rect width="112" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <circle cx="18" cy="12" r="2" fill="#F05032"/>
        <circle cx="18" cy="18" r="2" fill="#F05032"/>
        <circle cx="23" cy="15" r="2" fill="#F05032"/>
        <path d="M 18 12 L 18 18 M 18 15 L 23 15" stroke="#F05032" stroke-width="1.2"/>
        <text x="31" y="19" class="stack-badge-label">Git &amp; GitHub</text>
      </g>
    </g>
  </g>

  <!-- LAYER 2: MARKETING & PERFORMANCE CAMPAIGNS -->
  <g transform="translate(45, 220)">
    <rect width="760" height="110" rx="12" fill="#0B0B0B" stroke="#222222" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="110" rx="2" fill="#D1D5DB"/>

    <!-- Category Header -->
    <g transform="translate(20, 16)">
      <text x="0" y="10" class="stack-cat-title">DIGITAL MARKETING</text>
      <text x="160" y="10" class="stack-cat-sub">// META ADS, AUDIENCE TARGETING &amp; GROWTH STRATEGY</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(20, 42)">
      <!-- Meta / Facebook Ads -->
      <g transform="translate(0, 0)">
        <rect width="145" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- Meta Infinity Icon -->
        <path d="M 14 15 C 14 12 17 12 19 15 C 21 18 24 18 24 15 C 24 12 21 12 19 15 C 17 18 14 18 14 15 Z" fill="none" stroke="#0081FB" stroke-width="1.6"/>
        <text x="30" y="19" class="stack-badge-label">Facebook/Meta Ads</text>
      </g>

      <!-- Social Media Marketing -->
      <g transform="translate(153, 0)">
        <rect width="175" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- SMM Network Icon -->
        <circle cx="16" cy="15" r="2.5" fill="#E31B23"/>
        <circle cx="24" cy="11" r="2" fill="#D1D5DB"/>
        <circle cx="24" cy="19" r="2" fill="#D1D5DB"/>
        <line x1="16" y1="15" x2="24" y2="11" stroke="#888888" stroke-width="1"/>
        <line x1="16" y1="15" x2="24" y2="19" stroke="#888888" stroke-width="1"/>
        <text x="32" y="19" class="stack-badge-label">Social Media Marketing</text>
      </g>

      <!-- Digital Marketing Strategy -->
      <g transform="translate(336, 0)">
        <rect width="168" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- Strategy / Funnel Icon -->
        <path d="M 13 10 L 23 10 L 19 15 L 19 20 L 17 19 L 17 15 Z" fill="#E31B23"/>
        <text x="30" y="19" class="stack-badge-label">Digital Marketing</text>
      </g>

      <!-- Creative Advertising -->
      <g transform="translate(512, 0)">
        <rect width="156" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- Sparkle / Creative Icon -->
        <path d="M 18 9 L 19.5 13.5 L 24 15 L 19.5 16.5 L 18 21 L 16.5 16.5 L 12 15 L 16.5 13.5 Z" fill="#FFC72C"/>
        <text x="30" y="19" class="stack-badge-label">Creative Advertising</text>
      </g>
    </g>
  </g>

  <!-- LAYER 3: CREATIVE TOOLS & PRODUCTION -->
  <g transform="translate(45, 345)">
    <rect width="760" height="110" rx="12" fill="#0B0B0B" stroke="#222222" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="110" rx="2" fill="#E31B23"/>

    <!-- Category Header -->
    <g transform="translate(20, 16)">
      <text x="0" y="10" class="stack-cat-title">CREATIVE PRODUCTION</text>
      <text x="180" y="10" class="stack-cat-sub">// VIDEO EDITING, VISUAL ASSETS &amp; BRAND CONTENT</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(20, 42)">
      <!-- Adobe Premiere Pro -->
      <g transform="translate(0, 0)">
        <rect width="168" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- Pr Icon -->
        <rect x="10" y="7" width="16" height="16" rx="3" fill="#00005B"/>
        <text x="13" y="19" font-family="sans-serif" font-size="9" font-weight="800" fill="#9999FF">Pr</text>
        <text x="32" y="19" class="stack-badge-label">Adobe Premiere Pro</text>
      </g>

      <!-- Canva -->
      <g transform="translate(176, 0)">
        <rect width="82" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <!-- Canva Icon -->
        <circle cx="18" cy="15" r="7" fill="#00C4CC"/>
        <text x="15" y="18" font-family="sans-serif" font-size="9" font-weight="900" font-style="italic" fill="#FFFFFF">C</text>
        <text x="31" y="19" class="stack-badge-label">Canva</text>
      </g>

      <!-- Video Editing -->
      <g transform="translate(266, 0)">
        <rect width="118" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <path d="M 12 11 L 18 11 L 18 19 L 12 19 Z M 18 13 L 24 10 L 24 20 L 18 17 Z" fill="#E31B23"/>
        <text x="30" y="19" class="stack-badge-label">Video Editing</text>
      </g>

      <!-- Content Creation -->
      <g transform="translate(392, 0)">
        <rect width="138" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <rect x="12" y="10" width="12" height="10" rx="2" fill="none" stroke="#D1D5DB" stroke-width="1.2"/>
        <line x1="12" y1="14" x2="24" y2="14" stroke="#D1D5DB" stroke-width="1.2"/>
        <text x="30" y="19" class="stack-badge-label">Content Creation</text>
      </g>

      <!-- Video Advertisements -->
      <g transform="translate(538, 0)">
        <rect width="168" height="30" rx="6" fill="#121212" stroke="#262626" stroke-width="0.8"/>
        <circle cx="18" cy="15" r="6" fill="none" stroke="#E31B23" stroke-width="1.2"/>
        <path d="M 16 12 L 21 15 L 16 18 Z" fill="#E31B23"/>
        <text x="30" y="19" class="stack-badge-label">Video Advertisements</text>
      </g>
    </g>
  </g>
</svg>